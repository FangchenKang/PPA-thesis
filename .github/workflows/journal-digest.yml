name: Journal digest

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Shanghai.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      MAIL_TO: kangfangchen@sjtu.edu.cn
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      LLM_BASE_URL: https://models.sjtu.edu.cn/api/v1
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: deepseek-chat
      PER_JOURNAL_LIMIT: "5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run journal tracker
        run: python -m journal_tracker run --all-due --send-email

      - name: Commit generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/items reports
          git diff --cached --quiet || git commit -m "Update journal digest"
          git push
