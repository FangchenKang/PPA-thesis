name: Historical backfill

on:
  workflow_dispatch:
    inputs:
      start_id:
        description: "First journal id to process"
        required: false
        default: "1"
      end_id:
        description: "Last journal id to process"
        required: false
        default: "192"
      max_pages_per_journal:
        description: "OpenAlex pages per journal; 0 means no explicit page limit"
        required: false
        default: "0"
      include_abstracts:
        description: "Store abstracts when OpenAlex provides them"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      OPENALEX_MAILTO: kangfangchen@sjtu.edu.cn
      OPENALEX_SLEEP_SECONDS: "0.15"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Backfill historical metadata
        run: |
          args=(
            --start-id "${{ inputs.start_id }}"
            --end-id "${{ inputs.end_id }}"
            --max-pages-per-journal "${{ inputs.max_pages_per_journal }}"
          )
          if [ "${{ inputs.include_abstracts }}" = "true" ]; then
            args+=(--include-abstracts)
          fi
          python -m journal_tracker backfill "${args[@]}"

      - name: Commit historical metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          git diff --cached --quiet || git commit -m "Backfill historical journal metadata"
          git push
